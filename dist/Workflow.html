<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
:root{--bg:#0f141c;--p1:#161d29;--p2:#1c2534;--p3:#232e40;--bd:#2a3549;--tx:#e8eef6;--tx2:#a8b4c4;--tx3:#6f7d91;
--navy:#1B3F7A;--teal:#2DD4BF;--blue:#60A5FA;--amber:#FBBF24;--purple:#A78BFA;--red:#F87171;--green:#4ADE80;--slate:#94A3B8;--orange:#FB923C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.4 Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* header cực quang */
.hd{position:relative;display:flex;align-items:center;gap:12px;padding:12px 18px;overflow:hidden;border-bottom:1px solid var(--bd);background:#111927}
.hd:before{content:"";position:absolute;inset:-60% -10%;background:conic-gradient(from 0deg,rgba(45,212,191,.18),rgba(96,165,250,.14),rgba(167,139,250,.14),rgba(45,212,191,.18));filter:blur(40px);animation:au 18s linear infinite;pointer-events:none}
.hd:after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-140px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:sw 6s ease-in-out infinite;pointer-events:none}
@keyframes au{to{transform:rotate(360deg)}}@keyframes sw{0%,60%{left:-140px}100%{left:110%}}
.hd>*{position:relative;z-index:1}
.lg{width:40px;height:30px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font:800 12px Inter;box-shadow:inset 0 0 0 1.5px var(--teal),0 0 16px rgba(45,212,191,.25)}
.lg b{color:var(--teal);animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{text-shadow:0 0 8px var(--teal)}}
.tt b{display:block;font-size:15.5px;font-weight:700}.tt span{font-size:11.5px;color:var(--tx3)}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);margin-left:6px}.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.sp{flex:1}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:9px;padding:7px 10px;background:var(--p1);width:270px}
.srch input{border:0;outline:0;background:none;font:13px inherit;width:100%;color:var(--tx)}.srch input::placeholder{color:var(--tx3)}
.tabs{position:relative;display:flex;background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:3px}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:6px 14px;font:600 12.5px inherit;color:var(--tx2);cursor:pointer;border-radius:7px}
.tabs button.on{color:#06222a}.tabs .ind{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--teal);transition:left .25s,width .25s}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 18px 8px}
.kp{position:relative;background:var(--p1);border:1px solid var(--bd);border-radius:12px;padding:11px 13px 10px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.kp:hover{transform:translateY(-2px);border-color:var(--c)}.kp.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 6px 20px -8px var(--c)}
.kp .top{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--c);text-transform:uppercase}
.kp .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent)}
.kp .n{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kp .s{font-size:11px;color:var(--tx3)}
.kp .mb{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--p3)}.kp .mb i{display:block;height:100%;background:var(--c);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.kp.late .n{color:var(--red);text-shadow:0 0 14px rgba(248,113,113,.45)}
.main{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px}
/* bộ lọc đang chọn */
.flt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 18px 8px;font-size:11.5px;color:var(--tx3)}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--p2);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;color:var(--tx)}
.tag button{border:0;background:none;color:var(--tx3);cursor:pointer;font-size:14px;line-height:1;padding:0}
/* ma trận kiểm soát */
.ctl{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.box{background:var(--p1);border:1px solid var(--bd);border-radius:14px;padding:14px}
.box h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}.box h3 small{color:var(--tx3);font-weight:400}
.mx{width:100%;border-collapse:separate;border-spacing:6px}
.mx th{font-size:11px;font-weight:700;color:var(--tx2);text-align:center;padding:2px 4px}.mx th.l{text-align:left}
.mx td.p{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.cell{height:46px;border-radius:9px;text-align:center;font:800 17px Inter;cursor:pointer;transition:transform .12s;color:#fff;font-variant-numeric:tabular-nums}
.cell:hover{transform:scale(1.06)}.cell.z{color:var(--tx3);background:var(--p2) !important;font-weight:500;cursor:default}.cell.z:hover{transform:none}
.cell.on{outline:2px solid #fff}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 10px Inter;color:#0b1220;background:var(--ac);flex:none}
.top5 .it{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.top5 .it:hover{background:var(--p2)}
.od{min-width:54px;text-align:center;border-radius:8px;padding:4px 0;background:rgba(248,113,113,.14);color:var(--red);font:800 16px Inter;line-height:1.05}.od small{display:block;font:600 9.5px Inter}
.top5 .tx{flex:1;min-width:0}.top5 .tx b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top5 .tx span{font:11px ui-monospace,Consolas,monospace;color:var(--tx3)}
.pill{font:700 10.5px Inter;border-radius:999px;padding:2px 8px;color:#0b1220;background:var(--ac);white-space:nowrap}
.ok5{color:var(--green);padding:16px;text-align:center}
/* bảng kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;min-width:1120px}
.col{border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--p1)) 0,var(--p1) 120px);border:1px solid var(--bd);display:flex;flex-direction:column;min-height:320px}
.ch{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--bd);font-weight:700;font-size:12.5px}
.ch .no{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--c);color:#0b1220;font:800 11px Inter}
.ch .cnt{margin-left:auto;font:800 13px Inter;color:var(--c)}
.cl{padding:8px;display:flex;flex-direction:column;gap:8px}
.cd{position:relative;background:var(--p2);border:1px solid var(--bd);border-left:4px solid var(--sc);border-radius:10px;padding:9px 10px;cursor:pointer;transition:transform .12s,box-shadow .12s;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.cd:hover{transform:translateY(-2px);box-shadow:0 8px 22px -10px var(--sc)}
.cd.QUA_HAN{box-shadow:0 0 0 1px rgba(248,113,113,.35);animation:in .35s both,gw 2.2s ease-in-out infinite}
@keyframes gw{50%{box-shadow:0 0 0 1px rgba(248,113,113,.7),0 0 16px -4px rgba(248,113,113,.6)}}
.r1{display:flex;align-items:center;gap:6px}
.ty{font:800 10.5px Inter;padding:2px 7px;border-radius:5px;color:#0b1220;background:var(--tc);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:11px;color:var(--tx3)}
.sl{margin-left:auto;font:800 10px Inter;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc);white-space:nowrap}
.sj{font-weight:600;font-size:12.8px;margin:7px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.co{font:11px ui-monospace,Consolas,monospace;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3{display:flex;align-items:center;gap:7px;margin-top:8px}
.r3 .av{width:22px;height:22px;font-size:9px}
.who{font-size:11.5px;color:var(--tx2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font:700 11px Inter;color:var(--sc);white-space:nowrap}
.more{font-size:11.5px;color:var(--tx3);text-align:center;padding:4px}.empty{color:var(--tx3);font-size:12px;text-align:center;padding:22px 6px}
/* danh sách */
table.ls{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px;background:var(--p1);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ls th{background:var(--p2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);padding:10px;position:sticky;top:0;cursor:pointer;white-space:nowrap}
.ls td{padding:9px 10px;border-top:1px solid var(--bd);vertical-align:top}.ls tr:hover td{background:var(--p2);cursor:pointer}
.ls tr td:first-child{border-left:4px solid var(--sc)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.load{padding:40px;color:var(--tx3);text-align:center}.err{padding:20px;color:var(--red)}
.aib{border:1px solid rgba(167,139,250,.5);background:rgba(167,139,250,.12);color:#C4B5FD;border-radius:7px;padding:2px 7px;font:700 10.5px Inter;cursor:pointer;margin-left:4px}
.aib:hover{background:rgba(167,139,250,.28);color:#fff}
.aibig{border:0;border-radius:9px;padding:8px 13px;font:700 12.5px Inter;color:#0b1220;cursor:pointer;background:linear-gradient(90deg,#A78BFA,#60A5FA,#2DD4BF);background-size:200% 100%;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.dr{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#131b27;border-left:1px solid var(--bd);box-shadow:-20px 0 40px rgba(0,0,0,.4);transform:translateX(105%);transition:transform .25s;z-index:20;display:flex;flex-direction:column}
.dr.on{transform:none}.dr .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:700}
.dr .dh button{margin-left:auto;border:0;background:none;color:var(--tx2);font-size:20px;cursor:pointer}
.dr .db{flex:1;overflow:auto;padding:14px}
.ai-lv{display:inline-block;font:800 11px Inter;border-radius:6px;padding:3px 8px;color:#0b1220}
.ai-sec{margin-top:12px}.ai-sec h5{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)}
.ai-sec p,.ai-sec li{margin:0;font-size:13px;line-height:1.55}.ai-sec ul{margin:0;padding-left:18px}
.ai-draft{white-space:pre-wrap;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12.5px}
.ai-note{margin-top:12px;font-size:11px;color:#FBBF24;background:rgba(251,191,36,.1);border-radius:8px;padding:7px 9px}
.cp{margin-top:6px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);border-radius:7px;padding:4px 10px;font:600 11.5px Inter;cursor:pointer}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--p2),var(--p3),var(--p2));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:8px 0}
.prog{font-size:12px;color:var(--tx2);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style></head><body>
<div id="app"><div class="load">Đang đọc Register…</div></div>
<div class="dr" id="dr"><div class="dh"><span style="color:#C4B5FD">✦</span><span id="drT">Trợ lý AI đọc nội dung</span><button onclick="closeDr()">×</button></div><div class="db" id="drB"></div></div>
<script>
var D=null,S={view:'ctl',step:'',bic:'',sla:'',q:'',sort:'late'},first=true;
var STEP=[{c:'#94A3B8',n:'Chưa trình'},{c:'#60A5FA',n:'Đã trình – chờ phản hồi'},{c:'#A78BFA',n:'Chờ CĐT / TVTK'},{c:'#FBBF24',n:'Trả về – trình lại'},{c:'#4ADE80',n:'Đã có kết quả'}];
var SLA={QUA_HAN:{c:'#F87171',n:'Quá hạn'},SAP_HAN:{c:'#FBBF24',n:'Đến hạn ≤ 2 ngày'},CON_HAN:{c:'#2DD4BF',n:'Còn hạn'},KHONG_HAN:{c:'#94A3B8',n:'Chưa có hạn'},XONG:{c:'#4ADE80',n:'Đã xong'}};
var SLAO=['QUA_HAN','SAP_HAN','CON_HAN','KHONG_HAN','XONG'];
var TYC={RFI:'#2DD4BF',RFA:'#60A5FA',RFC:'#A78BFA',SDS:'#38BDF8',MSS:'#FB923C',MAS:'#F472B6',OTS:'#94A3B8',SCH:'#A3E635'};
var PC={'Nhà thầu':'#FB923C','TVGS':'#60A5FA','CĐT':'#A78BFA','TBCONS':'#2DD4BF','—':'#4ADE80'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function party(b){return String(b||'').replace(/ \(.*$/,'')}
function pc(p){return PC[p]||'#CBD5E1'}
function ini(b){var p=party(b);if(p==='—')return '✓';var m=/\((.+)\)/.exec(b||'');var s=m?m[1]:p;return s.split(/\s+/).filter(Boolean).slice(-2).map(function(w){return w[0]}).join('').toUpperCase().slice(0,2)}
function all(){var a=[];D.steps.forEach(function(s,i){D.cols[s].forEach(function(x){x.si=i;a.push(x)})});return a}
function pass(x,skip){skip=skip||{};
 if(!skip.step&&S.step!==''&&x.si!==+S.step)return false;if(!skip.bic&&S.bic&&party(x.bic)!==S.bic)return false;if(!skip.sla&&S.sla&&x.sla!==S.sla)return false;
 if(S.q){var q=S.q.toLowerCase();if((x.so+' '+x.nd+' '+x.bic+' '+x.loai+' '+(x.nguoi||'')).toLowerCase().indexOf(q)<0)return false}return true}
function dueTxt(x){if(x.sla==='XONG')return 'Đã xong';if(x.d==='')return x.cho!==''?'chờ '+x.cho+' ngày':'chưa có hạn';if(x.d<0)return 'trễ '+(-x.d)+' ngày';if(x.d===0)return 'hạn hôm nay';return 'còn '+x.d+' ngày'}
function card(x,i){var sc=SLA[x.sla].c;
 return '<div class="cd '+x.sla+'" style="--sc:'+sc+';animation-delay:'+Math.min(i,12)*25+'ms" data-at="'+esc(x.at)+'"><div class="r1"><span class="ty" style="--tc:'+(TYC[x.loai]||'#CBD5E1')+'" title="'+esc(x.loai)+'">'+esc(x.loai||'—')+'</span>'+(x.rev!==''?'<span class="rv">Rev '+esc(x.rev)+'</span>':'')+'<span class="sl">'+esc(SLA[x.sla].n)+'</span><button class="aib" data-ai="'+esc(x.at)+'" title="AI đọc nội dung hồ sơ">✦ AI</button></div>'+
 '<div class="sj">'+esc(x.nd||'(chưa có nội dung)')+'</div><div class="co" title="'+esc(x.so)+'">'+esc(x.so)+'</div>'+
 '<div class="r3"><span class="av" style="--ac:'+pc(party(x.bic))+'">'+esc(ini(x.bic))+'</span><span class="who">'+(party(x.bic)==='—'?'Không còn ai giữ':esc(x.bic))+'</span><span class="due">'+esc(dueTxt(x))+'</span></div></div>'}
function ico(k){var p={a:'M4 6h16M4 12h10M4 18h7',b:'M5 12l5 5L20 7',c:'M12 8v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',d:'M4 12a8 8 0 1 1 3 6.3M4 12V7M4 12h5',e:'M12 3l9 16H3z M12 10v4 M12 17v.5',f:'M3 12h4l3-8 4 16 3-8h4'}[k];
 return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>'}
function draw(){
 var A=all(),F=A.filter(function(x){return pass(x)});
 var h='<div class="hd"><div class="lg">T<b>Q</b>N</div><div class="tt"><b>Kiểm soát quy trình hồ sơ</b><span>'+D.total+' hồ sơ · bản Rev mới nhất</span></div><div class="live"><i></i>cập nhật '+esc(D.at)+'</div><div class="sp"></div>'+
  '<div class="srch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f7d91" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Tìm số hiệu, nội dung, người…" value="'+esc(S.q)+'"></div>'+
  '<button class="aibig" id="aiAll" title="AI đọc lần lượt các hồ sơ quá hạn / trả về">✦ AI rà hồ sơ cần xử lý</button><div class="tabs" id="tabs"><span class="ind"></span><button data-v="ctl" class="'+(S.view==='ctl'?'on':'')+'">Kiểm soát</button><button data-v="board" class="'+(S.view==='board'?'on':'')+'">Theo bước</button><button data-v="list" class="'+(S.view==='list'?'on':'')+'">Danh sách</button></div></div>';
 var icons=['a','f','c','d','b'];
 h+='<div class="kpis">';
 D.steps.forEach(function(s,i){var n=D.cols[s].length;h+='<div class="kp'+(S.step===String(i)?' on':'')+'" data-s="'+i+'" style="--c:'+STEP[i].c+'"><div class="top"><span class="ic">'+ico(icons[i])+'</span>Bước '+(i+1)+'</div><div class="n" data-n="'+n+'">'+(first?0:n)+'</div><div class="s">'+STEP[i].n+'</div><div class="mb"><i data-w="'+(n/D.total*100)+'"></i></div></div>'});
 var nl=A.filter(function(x){return x.sla==='QUA_HAN'}).length;
 h+='<div class="kp late'+(S.sla==='QUA_HAN'?' on':'')+'" data-q="QUA_HAN" style="--c:#F87171"><div class="top"><span class="ic">'+ico('e')+'</span>Quá hạn</div><div class="n" data-n="'+nl+'">'+(first?0:nl)+'</div><div class="s">cần xử lý ngay</div><div class="mb"><i data-w="'+(nl/D.total*100)+'"></i></div></div></div>';
 var tg=[];if(S.step!=='')tg.push(['step','Bước '+(+S.step+1)+': '+STEP[+S.step].n]);if(S.bic)tg.push(['bic','Đang giữ: '+S.bic]);if(S.sla)tg.push(['sla',SLA[S.sla].n]);
 h+='<div class="flt">'+(tg.length?'Đang lọc: '+tg.map(function(t){return '<span class="tag">'+esc(t[1])+'<button data-x="'+t[0]+'">×</button></span>'}).join('')+' · <b style="color:#e8eef6">'+F.length+'</b> hồ sơ':'Bấm ô số, thẻ hoặc dòng để lọc · bấm hồ sơ để mở đúng dòng trong sổ')+'</div><div class="main">';
 if(S.view==='ctl'){
  var parties={};A.forEach(function(x){if(x.sla!=='XONG'){var p=party(x.bic);parties[p]=(parties[p]||0)+1}});
  var plist=Object.keys(parties).sort(function(a,b){return parties[b]-parties[a]});
  h+='<div class="ctl"><div class="box"><h3>Ai đang giữ việc × tình trạng hạn <small>số hồ sơ đang mở</small></h3><table class="mx"><tr><th class="l">Bên đang giữ</th>';
  SLAO.slice(0,4).forEach(function(k){h+='<th style="color:'+SLA[k].c+'">'+SLA[k].n+'</th>'});h+='<th>Tổng</th></tr>';
  plist.forEach(function(p){var row=A.filter(function(x){return party(x.bic)===p&&x.sla!=='XONG'&&pass(x,{bic:1,sla:1})});
   h+='<tr><td class="p"><span class="av" style="--ac:'+pc(p)+'">'+esc(ini(p))+'</span>'+esc(p)+'</td>';
   SLAO.slice(0,4).forEach(function(k){var n=row.filter(function(x){return x.sla===k}).length;var on=S.bic===p&&S.sla===k;
    h+='<td><div class="cell'+(n?'':' z')+(on?' on':'')+'" data-p="'+esc(p)+'" data-k="'+k+'" style="background:color-mix(in srgb,'+SLA[k].c+' '+Math.min(90,25+n*8)+'%,#161d29);line-height:46px">'+(n||'·')+'</div></td>'});
   h+='<td><div class="cell z" style="line-height:46px;color:#e8eef6">'+row.length+'</div></td></tr>'});
