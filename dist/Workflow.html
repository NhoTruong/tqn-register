<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
:root{--bg:#f4f6f9;--card:#fff;--bd:#e3e8ef;--bd2:#eef1f5;--tx:#18212d;--tx2:#4d5a6b;--tx3:#8792a2;--navy:#1B3F7A;--teal:#0f9d8f;
--red:#d93a3a;--redbg:#fdeeee;--amber:#d98a00;--amberbg:#fff6e5;--ok:#0f9d8f;--okbg:#e6f6f4;--gray:#9aa5b4;--graybg:#f1f3f6;--green:#1f9d55;--greenbg:#e8f6ee}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13.5px/1.45 Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* thanh trên */
.hd{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd)}
.lg{width:40px;height:30px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font:800 12px Inter;flex:none}
.lg b{color:#2DD4BF}
.tt{min-width:0}.tt b{display:block;font-size:16px;font-weight:700;white-space:nowrap}.tt span{font-size:12px;color:var(--tx3);white-space:nowrap}
.sp{flex:1}
.srch{display:flex;align-items:center;gap:7px;border:1px solid var(--bd);border-radius:9px;padding:7px 11px;background:var(--bg);width:250px}
.srch input{border:0;outline:0;background:none;font:13px inherit;width:100%;color:var(--tx)}
.btn-ai{display:flex;align-items:center;gap:6px;border:1px solid #d8cff8;background:#f5f2ff;color:#5b3fd1;border-radius:9px;padding:7px 12px;font:600 12.5px Inter;cursor:pointer;white-space:nowrap}
.btn-ai:hover{background:#ebe5ff}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;font:600 12.5px inherit;color:var(--tx2);cursor:pointer;border-radius:7px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.main{flex:1;min-height:0;overflow:auto;padding:18px 22px 24px}
/* thẻ số */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;cursor:pointer;border-top:4px solid var(--c);transition:box-shadow .15s}
.kp:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
.kp.on{box-shadow:0 0 0 2px var(--c)}
.kp .l{font-size:12px;color:var(--tx2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .n{font-size:30px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--tx)}
.kp.alert{background:var(--redbg);border-color:#f5c7c7}.kp.alert .n,.kp.alert .l{color:var(--red)}
.hint{font-size:12px;color:var(--tx3);margin:12px 2px 0}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px;color:var(--tx2)}
.tag{display:inline-flex;gap:6px;align-items:center;background:#eaf0fb;color:var(--navy);border-radius:999px;padding:3px 10px;font-weight:600}
.tag button{border:0;background:none;color:var(--navy);cursor:pointer;font-size:15px;line-height:1;padding:0}
/* khối */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;margin-top:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.bh{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--bd2)}
.bh b{font-size:14px}.bh span{font-size:12px;color:var(--tx3)}
.bb{padding:8px 16px 14px}
/* theo bên */
.prow{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd2)}
.prow:last-child{border-bottom:0}
.pn{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap;overflow:hidden}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px Inter;color:#fff;background:var(--ac);flex:none}
.stk{display:flex;height:28px;border-radius:7px;overflow:hidden;background:var(--graybg)}
.stk div{display:flex;align-items:center;justify-content:center;font:700 12px Inter;color:#fff;cursor:pointer;min-width:26px;transition:filter .15s}
.stk div:hover{filter:brightness(.92)}.stk div.on{box-shadow:inset 0 0 0 2px #18212d}
.ptot{text-align:right;font-weight:700;color:var(--tx2)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);padding:10px 16px 14px;border-top:1px solid var(--bd2)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
/* bảng */
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;font-weight:600;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;background:#fafbfc;position:sticky;top:0;cursor:default}
.t th[data-o]{cursor:pointer}.t th[data-o]:hover{color:var(--navy)}
.t td{padding:10px 12px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.t tr:hover td{background:#f8faff;cursor:pointer}
.sj{font-weight:600;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.co{font:11.5px ui-monospace,"SF Mono",Consolas,monospace;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.badge{display:inline-block;font:600 11.5px Inter;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--b);color:var(--f)}
.ty{display:inline-block;font:700 11px Inter;padding:2px 8px;border-radius:6px;background:var(--b);color:var(--f);white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.who .av{width:22px;height:22px;font-size:9.5px}
.aib{border:1px solid #d8cff8;background:#f5f2ff;color:#5b3fd1;border-radius:7px;padding:3px 9px;font:600 11.5px Inter;cursor:pointer;white-space:nowrap}
.aib:hover{background:#ebe5ff}
.empty{color:var(--tx3);text-align:center;padding:26px}
.t td:first-child,.t td:first-child div{white-space:nowrap}.grid2>.box{overflow:auto}.co{max-width:380px}
/* theo bước */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;min-width:1180px;margin-top:16px}
.col{background:#eef1f5;border-radius:12px;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13px;border-top:4px solid var(--c);border-radius:12px 12px 0 0;background:var(--card);border-bottom:1px solid var(--bd)}
.ch .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--tx2);background:var(--bg);border-radius:999px;padding:1px 9px}
.cl{padding:10px;display:flex;flex-direction:column;gap:10px}
.cd{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--sc);border-radius:10px;padding:11px 12px;cursor:pointer}
.cd:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
.cd .r1{display:flex;align-items:center;gap:6px;margin-bottom:6px}.cd .r1 .badge{margin-left:auto}
.cd .r3{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--tx2)}
.more{font-size:12px;color:var(--tx3);text-align:center;padding:4px}
/* AI */
.dr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--card);border-left:1px solid var(--bd);box-shadow:-16px 0 40px rgba(16,24,40,.14);transform:translateX(105%);transition:transform .25s;z-index:20;display:flex;flex-direction:column}
.dr.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:700}
.dh button{margin-left:auto;border:0;background:none;color:var(--tx2);font-size:22px;cursor:pointer;line-height:1}
.db{flex:1;overflow:auto;padding:16px}
.sec{margin-top:16px}.sec h5{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)}
.sec p,.sec li{margin:0;font-size:13.5px;line-height:1.6}.sec ul{margin:0;padding-left:18px}
.draft{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:13px}
.cp{margin-top:8px;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 12px;font:600 12px Inter;cursor:pointer}
.note{margin-top:16px;font-size:12px;color:#8a5a00;background:var(--amberbg);border-radius:9px;padding:9px 11px}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f5,#e2e7ee,#eef1f5);background-size:200% 100%;animation:sh 1.2s linear infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.load{padding:40px;color:var(--tx3);text-align:center}.err{padding:14px;color:var(--red);background:var(--redbg);border-radius:9px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.srch{width:180px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style></head><body>
<div id="app"><div class="load">Đang đọc Register…</div></div>
<div class="dr" id="dr"><div class="dh"><span style="color:#5b3fd1">✦</span><span id="drT">Trợ lý AI</span><button onclick="closeDr()" aria-label="Đóng">×</button></div><div class="db" id="drB"></div></div>
<script>
var D=null,S={view:'ctl',step:'',bic:'',sla:'',q:'',sort:'late'};
var STEP=[{c:'#9aa5b4',n:'Chưa trình'},{c:'#2f6fdb',n:'Đã trình – chờ phản hồi'},{c:'#7b5cd6',n:'Chờ CĐT / TVTK'},{c:'#d98a00',n:'Trả về – trình lại'},{c:'#1f9d55',n:'Đã có kết quả'}];
var SLA={QUA_HAN:{c:'#d93a3a',b:'#fdeeee',n:'Quá hạn'},SAP_HAN:{c:'#d98a00',b:'#fff6e5',n:'Đến hạn ≤ 2 ngày'},CON_HAN:{c:'#0f9d8f',b:'#e6f6f4',n:'Còn hạn'},KHONG_HAN:{c:'#9aa5b4',b:'#f1f3f6',n:'Chưa có hạn'},XONG:{c:'#1f9d55',b:'#e8f6ee',n:'Đã xong'}};
var SLAO=['QUA_HAN','SAP_HAN','CON_HAN','KHONG_HAN','XONG'];
var TY={RFI:['#e6f6f4','#0b7a6f'],RFA:['#e9f0fc','#2257b8'],RFC:['#f1edfc','#6342c0'],SDS:['#e7f3fb','#0c6aa6'],MSS:['#fff1e6','#b15a00'],MAS:['#fcebf3','#b02a6b'],OTS:['#f1f3f6','#4d5a6b'],SCH:['#eef7e6','#4f7a12']};
var PC={'Nhà thầu':'#e07a1f','TVGS':'#2f6fdb','CĐT':'#7b5cd6','TBCONS':'#0f9d8f','—':'#1f9d55'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function party(b){return String(b||'').replace(/ \(.*$/,'')}
function person(b){var m=/\((.+)\)/.exec(b||'');return m?m[1]:''}
function pc(p){return PC[p]||'#64748b'}
function ini(p){if(p==='—')return '✓';return String(p).split(/\s+/).filter(Boolean).slice(-2).map(function(w){return w[0]}).join('').toUpperCase().slice(0,2)}
function all(){var a=[];D.steps.forEach(function(s,i){D.cols[s].forEach(function(x){x.si=i;a.push(x)})});return a}
function pass(x,skip){skip=skip||{};
 if(!skip.step&&S.step!==''&&x.si!==+S.step)return false;if(!skip.bic&&S.bic&&party(x.bic)!==S.bic)return false;if(!skip.sla&&S.sla&&x.sla!==S.sla)return false;
 if(S.q){var q=S.q.toLowerCase();if((x.so+' '+x.nd+' '+x.bic+' '+x.loai).toLowerCase().indexOf(q)<0)return false}return true}
function dueTxt(x){if(x.sla==='XONG')return 'Đã xong';if(x.d==='')return 'Chưa có hạn';if(x.d<0)return 'Trễ '+(-x.d)+' ngày';if(x.d===0)return 'Hạn hôm nay';return 'Còn '+x.d+' ngày'}
function sbadge(x){var s=SLA[x.sla];return '<span class="badge" style="--b:'+s.b+';--f:'+s.c+'">'+esc(dueTxt(x))+'</span>'}
function tbadge(t){var c=TY[t]||['#f1f3f6','#4d5a6b'];return '<span class="ty" style="--b:'+c[0]+';--f:'+c[1]+'">'+esc(t||'—')+'</span>'}
function whoH(b){var p=party(b);if(p==='—')return '<span class="who" style="color:#1f9d55">✓ Không còn ai giữ</span>';var n=person(b);return '<span class="who"><span class="av" style="--ac:'+pc(p)+'">'+esc(ini(p))+'</span><span><b style="font-weight:600">'+esc(p)+'</b>'+(n?'<br><span style="font-size:11.5px;color:#8792a2">'+esc(n)+'</span>':'')+'</span></span>'}
function row(x,cols){var h='<tr data-at="'+esc(x.at)+'">';
 if(cols.due)h+='<td>'+sbadge(x)+(x.han?'<div style="font-size:11.5px;color:#8792a2;margin-top:3px">hạn '+esc(x.han)+'</div>':'')+'</td>';
 if(cols.step)h+='<td style="white-space:nowrap;color:'+STEP[x.si].c+';font-weight:600">'+(x.si+1)+'. '+STEP[x.si].n+'</td>';
 h+='<td>'+tbadge(x.loai)+'</td><td><div class="sj">'+esc(x.nd||'(chưa có nội dung)')+'</div><div class="co" title="'+esc(x.so)+'">'+esc(x.so)+(x.rev!==''?' · Rev '+esc(x.rev):'')+'</div></td><td>'+whoH(x.bic)+'</td>';
 if(cols.y)h+='<td style="max-width:280px;color:#4d5a6b;font-size:12.5px">'+esc(x.y||'')+'</td>';
 return h+'<td><button class="aib" data-ai="'+esc(x.at)+'">✦ AI đọc</button></td></tr>'}
function draw(){
 var A=all(),F=A.filter(function(x){return pass(x)}),open=A.filter(function(x){return x.sla!=='XONG'});
 var h='<div class="hd"><div class="lg">T<b>Q</b>N</div><div class="tt"><b>Kiểm soát hồ sơ trình duyệt</b><span>'+D.total+' hồ sơ (bản Rev mới nhất) · cập nhật '+esc(D.at)+'</span></div><div class="sp"></div>'+
  '<div class="srch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8792a2" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Tìm số hiệu, nội dung…" value="'+esc(S.q)+'"></div>'+
  '<button class="btn-ai" id="aiAll">✦ AI rà hồ sơ cần xử lý</button>'+
  '<div class="seg"><button data-v="ctl" class="'+(S.view==='ctl'?'on':'')+'">Tổng quan</button><button data-v="board" class="'+(S.view==='board'?'on':'')+'">Theo bước</button><button data-v="list" class="'+(S.view==='list'?'on':'')+'">Danh sách</button></div></div><div class="main">';
 h+='<div class="kpis">';
 D.steps.forEach(function(s,i){h+='<div class="kp'+(S.step===String(i)?' on':'')+'" data-s="'+i+'" style="--c:'+STEP[i].c+'"><div class="l">'+(i+1)+'. '+STEP[i].n+'</div><div class="n">'+D.cols[s].length+'</div></div>'});
 var nl=A.filter(function(x){return x.sla==='QUA_HAN'}).length;
 h+='<div class="kp alert'+(S.sla==='QUA_HAN'?' on':'')+'" data-q="1" style="--c:#d93a3a"><div class="l">⚠ Quá hạn – cần xử lý</div><div class="n">'+nl+'</div></div></div>';
 var tg=[];if(S.step!=='')tg.push(['step','Bước '+(+S.step+1)+': '+STEP[+S.step].n]);if(S.bic)tg.push(['bic','Bên giữ: '+S.bic]);if(S.sla)tg.push(['sla',SLA[S.sla].n]);if(S.q)tg.push(['q','Tìm: '+S.q]);
 h+=tg.length?'<div class="flt">Đang lọc '+tg.map(function(t){return '<span class="tag">'+esc(t[1])+'<button data-x="'+t[0]+'" aria-label="Bỏ lọc">×</button></span>'}).join('')+'<span>→ <b>'+F.length+'</b> hồ sơ</span></div>':'<div class="hint">Bấm vào thẻ số hoặc dòng để lọc · bấm hồ sơ để mở đúng dòng trong sổ</div>';
 if(S.view==='ctl'){
  h+='<div class="grid2" style="grid-template-columns:1fr">';
  var od=F.filter(function(x){return x.sla==='QUA_HAN'||x.sla==='SAP_HAN'||x.si===3}).sort(function(a,b){return SLAO.indexOf(a.sla)-SLAO.indexOf(b.sla)||(a.d===''?0:a.d)-(b.d===''?0:b.d)});
  h+='<div class="box"><div class="bh"><b>Cần xử lý trước</b><span>quá hạn, sắp đến hạn, bị trả về · '+od.length+' hồ sơ</span></div>';
  h+=od.length?'<table class="t"><thead><tr><th>Hạn</th><th>Loại</th><th>Hồ sơ</th><th>Đang giữ</th><th></th></tr></thead><tbody>'+od.slice(0,15).map(function(x){return row(x,{due:1})}).join('')+'</tbody></table>':'<div class="empty">✓ Không có hồ sơ quá hạn hay sắp đến hạn</div>';
  h+='</div></div>';
 }else if(S.view==='board'){h+='<div class="board">';
  D.steps.forEach(function(s,i){var it=F.filter(function(x){return x.si===i}).sort(function(a,b){return SLAO.indexOf(a.sla)-SLAO.indexOf(b.sla)||(+b.cho||0)-(+a.cho||0)});
   h+='<div class="col"><div class="ch" style="--c:'+STEP[i].c+'">'+(i+1)+'. '+STEP[i].n+'<span class="cnt">'+it.length+'</span></div><div class="cl">';
   h+=it.length?it.slice(0,40).map(function(x){return '<div class="cd" style="--sc:'+SLA[x.sla].c+'" data-at="'+esc(x.at)+'"><div class="r1">'+tbadge(x.loai)+(x.rev!==''?'<span style="font-size:11.5px;color:#8792a2">Rev '+esc(x.rev)+'</span>':'')+sbadge(x)+'</div><div class="sj">'+esc(x.nd||'(chưa có nội dung)')+'</div><div class="co">'+esc(x.so)+'</div><div class="r3">'+whoH(x.bic)+'<span class="sp"></span><button class="aib" data-ai="'+esc(x.at)+'">✦ AI</button></div></div>'}).join(''):'<div class="empty">Không có hồ sơ</div>';
   if(it.length>40)h+='<div class="more">+ '+(it.length-40)+' hồ sơ · xem Danh sách</div>';h+='</div></div>'});
  h+='</div>';
 }else{
  var key={late:function(x){return SLAO.indexOf(x.sla)*1e4+(x.d===''?5000:x.d)},step:function(x){return x.si},loai:function(x){return String(x.loai)}}[S.sort];
  F.sort(function(a,b){var A1=key(a),B1=key(b);return A1<B1?-1:A1>B1?1:0});
  h+='<div class="box" style="margin-top:16px;overflow:auto"><table class="t" style="min-width:1050px"><thead><tr><th data-o="late">Hạn ↕</th><th data-o="step">Bước ↕</th><th data-o="loai">Loại ↕</th><th>Hồ sơ</th><th>Đang giữ</th><th>Ý kiến gần nhất</th><th></th></tr></thead><tbody>'+
   F.map(function(x){return row(x,{due:1,step:1,y:1})}).join('')+'</tbody></table>'+(F.length?'':'<div class="empty">Không có hồ sơ khớp bộ lọc</div>')+'</div>';
 }
 document.getElementById('app').innerHTML=h+'</div>';
 var q=document.getElementById('q');q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
 each('.seg button',function(b){b.onclick=function(){S.view=b.getAttribute('data-v');draw()}});
 each('.kp[data-s]',function(b){b.onclick=function(){var v=b.getAttribute('data-s');S.step=S.step===v?'':v;draw()}});
 each('.kp[data-q]',function(b){b.onclick=function(){S.sla=S.sla==='QUA_HAN'?'':'QUA_HAN';draw()}});
 each('.stk div[data-k]',function(c){c.onclick=function(){var p=c.getAttribute('data-p'),k=c.getAttribute('data-k');if(S.bic===p&&S.sla===k){S.bic='';S.sla=''}else{S.bic=p;S.sla=k}draw()}});
 each('.tag button',function(b){b.onclick=function(){S[b.getAttribute('data-x')]='';draw()}});
 each('th[data-o]',function(b){b.onclick=function(){S.sort=b.getAttribute('data-o');draw()}});
 each('[data-at]',function(c){c.onclick=function(){google.script.run.tqnGoto(c.getAttribute('data-at'))}});
 each('[data-ai]',function(b){b.onclick=function(e){e.stopPropagation();aiOne(b.getAttribute('data-ai'))}});
 document.getElementById('aiAll').onclick=aiAll;
}

function openDr(t,h){document.getElementById('drT').textContent=t;document.getElementById('drB').innerHTML=h;document.getElementById('dr').classList.add('on')}
function closeDr(){document.getElementById('dr').classList.remove('on')}
function aiHtml(o){var lv=LV[o.muc_do]||LV.TRUNG_BINH;
 return '<div class="co" style="max-width:none">'+esc(o.so||'')+'</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="badge" style="--b:'+lv[1]+';--f:'+lv[0]+'">'+lv[2]+'</span><span class="badge" style="--b:#eaf0fb;--f:#1B3F7A">Bên xử lý: '+esc(o.ben_xu_ly||'?')+'</span></div>'+
 '<div class="sec"><h5>Tóm tắt</h5><p>'+esc(o.tom_tat)+'</p></div><div class="sec"><h5>Việc tiếp theo</h5><p>'+esc(o.viec_tiep_theo)+'</p></div>'+
 (o.can_bo_sung&&o.can_bo_sung.length?'<div class="sec"><h5>Cần bổ sung / sửa</h5><ul>'+o.can_bo_sung.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'')+
 (o.nhap_tra_loi?'<div class="sec"><h5>Nháp trả lời</h5><div class="draft">'+esc(o.nhap_tra_loi)+'</div><button class="cp" onclick="cp(this)">Chép nháp</button></div>':'')+
 '<div class="note">Bản nháp do AI soạn từ nội dung trong Register ('+esc(o.model||'AI')+'), đã lưu vào tab TQN_AI. Người phụ trách kiểm tra trước khi dùng.</div>'}
function cp(b){var t=b.previousElementSibling.textContent;try{navigator.clipboard.writeText(t).then(function(){b.textContent='Đã chép'},function(){b.textContent='Bôi đen để chép'})}catch(e){b.textContent='Bôi đen để chép'}}
function wait(t){return '<div style="color:#4d5a6b">'+esc(t)+'</div><div class="sk"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:64%"></div>'}
function aiOne(at){openDr('Trợ lý AI đọc nội dung',wait('AI đang đọc nội dung và ý kiến các bên…'));
 google.script.run.withSuccessHandler(function(o){openDr('Trợ lý AI',aiHtml(o))}).withFailureHandler(function(e){openDr('Trợ lý AI','<div class="err">'+esc(e.message||e)+'</div>')}).tqnAiAnalyze(at)}
function aiAll(){var it=all().filter(function(x){return x.sla==='QUA_HAN'||x.si===3}).slice(0,10);if(!it.length){openDr('AI rà hồ sơ','<div class="empty">Không có hồ sơ quá hạn hay bị trả về.</div>');return}
 var out=[],i=0;function next(){if(i>=it.length){openDr('AI đã đọc '+it.length+' hồ sơ',out.map(function(o){return o.err?'<div class="err" style="margin-bottom:10px">'+esc(o.err)+'</div>':'<div style="border-bottom:1px solid #e3e8ef;padding-bottom:16px;margin-bottom:16px">'+aiHtml(o)+'</div>'}).join(''));return}
  openDr('AI rà hồ sơ cần xử lý',wait('Đang đọc hồ sơ '+(i+1)+'/'+it.length+': '+it[i].nd));
  google.script.run.withSuccessHandler(function(o){out.push(o);i++;next()}).withFailureHandler(function(e){out.push({err:it[i].so+': '+(e.message||e)});i++;if(/Chưa bật AI|chưa được dùng AI|Chưa cho phép/.test(e.message||''))i=it.length;next()}).tqnAiAnalyze(it[i].at)}
 next()}
google.script.run.withSuccessHandler(function(d){D=d;draw()}).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="err" style="margin:20px">'+esc(e.message||e)+'</div>'}).tqnWorkflowData();
