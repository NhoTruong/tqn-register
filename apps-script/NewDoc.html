<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;font:13px Inter,Segoe UI,Arial,sans-serif;color:#202124}
.tabs{display:flex;border-bottom:1px solid #dadce0}.tabs button{flex:1;border:0;background:none;padding:10px;font:600 13px inherit;cursor:pointer;color:#5f6368;border-bottom:3px solid transparent}
.tabs button.on{color:#1B3F7A;border-bottom-color:#1F8A8A}
.p{padding:12px 16px;display:none}.p.on{display:block}
label{display:block;font-size:12px;color:#5f6368;margin:9px 0 3px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #c7ccd1;border-radius:6px;font:13px inherit}
textarea{height:54px;resize:vertical}
.row{display:flex;gap:8px}.row>div{flex:1}
.code{margin-top:12px;background:#eef4fb;border-radius:8px;padding:10px;font:600 14px ui-monospace,Consolas,monospace;color:#1B3F7A;word-break:break-all;min-height:40px}
.code small{display:block;font:11px Inter,Arial;color:#5f6368;margin-bottom:3px}
.ck{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px}.ck input{width:auto}
.btn{margin-top:12px;width:100%;border:0;border-radius:8px;padding:10px;font:700 14px inherit;background:#1B3F7A;color:#fff;cursor:pointer}
.btn.s{background:#fff;color:#1B3F7A;border:1px solid #1B3F7A;margin-top:6px}
.msg{margin-top:10px;font-size:12px;line-height:1.5}.ok{color:#137333}.er{color:#b3261e}
</style></head><body>
<div class="tabs"><button class="on" data-p="a">Hồ sơ mới</button><button data-p="b">Trình lại (Rev+1)</button></div>
<div class="p on" id="a">
 <div class="row"><div><label>Loại hồ sơ</label><select id="type"><option>RFI</option><option>RFA</option><option>RFC</option><option>SDS</option><option>MSS</option><option>MAS</option><option>OTS</option></select></div>
 <div id="wn"><label>Nhóm (RFA)</label><input id="nhom" value="COS"></div>
 <div id="wg"><label>Gói</label><select id="goi"><option>NP</option><option>HTKT</option></select></div></div>
 <label>Nội dung hồ sơ</label><textarea id="subject" placeholder="Vd: Yêu cầu làm rõ thông tin – cao độ sàn tầng 2"></textarea>
 <div class="row"><div><label>Người thực hiện</label><input id="owner"></div><div><label>Ngày trình</label><input id="date" type="date"></div></div>
 <div class="code" id="pv"><small>Mã sẽ cấp (xem trước, chưa giữ số)</small>—</div>
 <label class="ck"><input type="checkbox" id="write" checked> Ghi mã + nội dung vào dòng trống tiếp theo của sổ chi tiết (không đè ô có dữ liệu)</label>
 <button class="btn" id="issue">Cấp mã</button>
 <div class="msg" id="m1"></div>
</div>
<div class="p" id="b">
 <label>Số hiệu lần trình trước</label><input id="from" placeholder="Vd: 261116-COA-TBC-RFI-001 rev01">
 <label>Nội dung (nếu đổi)</label><textarea id="subject2"></textarea>
 <label class="ck"><input type="checkbox" id="write2" checked> Ghi vào dòng trống tiếp theo của sổ chi tiết</label>
 <button class="btn" id="revise">Cấp mã trình lại</button>
 <div class="msg" id="m2"></div>
</div>
<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var d=new Date();$('date').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){
 Array.prototype.forEach.call(document.querySelectorAll('.tabs button,.p'),function(x){x.classList.remove('on')});b.classList.add('on');$(b.getAttribute('data-p')).classList.add('on')}});
function form(){return{type:$('type').value,nhom:$('nhom').value,goi:$('goi').value,subject:$('subject').value,owner:$('owner').value,date:$('date').value,write:$('write').checked}}
function vis(){var t=$('type').value;$('wn').style.display=t==='RFA'?'':'none';$('wg').style.display=/SDS|MSS|MAS|OTS/.test(t)?'':'none'}
function pv(){vis();$('pv').innerHTML='<small>Mã sẽ cấp (xem trước, chưa giữ số)</small>…';
 google.script.run.withSuccessHandler(function(c){$('pv').innerHTML='<small>Mã sẽ cấp (xem trước, chưa giữ số)</small>'+esc(c)}).withFailureHandler(function(e){$('pv').innerHTML='<small>Lỗi</small>'+esc(e.message||e)}).tqnPreviewCode(form())}
['type','nhom','goi','date'].forEach(function(i){$(i).onchange=pv});pv();
$('issue').onclick=function(){var b=this;b.disabled=true;$('m1').innerHTML='Đang cấp mã (có khóa chống trùng)…';
 google.script.run.withSuccessHandler(function(r){b.disabled=false;$('m1').innerHTML='<span class="ok">✔ Đã cấp: <b>'+esc(r.code)+'</b>'+(r.where?'<br>Đã ghi vào '+esc(r.where):'')+'<br>Đã lưu vào tab TQN_CAP_MA.</span>';pv()})
 .withFailureHandler(function(e){b.disabled=false;$('m1').innerHTML='<span class="er">✖ '+esc(e.message||e)+'</span>'}).tqnIssueCode(form())};
$('revise').onclick=function(){var b=this;b.disabled=true;$('m2').innerHTML='Đang cấp…';
 google.script.run.withSuccessHandler(function(r){b.disabled=false;$('m2').innerHTML='<span class="ok">✔ Mã trình lại: <b>'+esc(r.code)+'</b> (Rev '+esc(r.rev)+')'+(r.where?'<br>Đã ghi vào '+esc(r.where):'')+'</span>'})
 .withFailureHandler(function(e){b.disabled=false;$('m2').innerHTML='<span class="er">✖ '+esc(e.message||e)+'</span>'}).tqnReviseCode({from:$('from').value,subject:$('subject2').value,write:$('write2').checked})};
</script></body></html>
