   h+='<td'+(sp?' rowspan="'+sp[0]+'" colspan="'+sp[1]+'"':'')+(typeof x==='number'&&!s0[3]?' class="num"':'')+(ed?' class="ed" contenteditable data-r="'+r+'"':'')+(css?' style="'+css+'"':'')+' title="'+t.slice(0,300)+'">'+t+'</td>'}h+='</tr>'}
 $('grid').innerHTML=h+'</table>';
 if(edit)$('grid').querySelectorAll('td.ed').forEach(td=>td.addEventListener('blur',()=>{byName.TQN_CONFIG.set(+td.dataset.r,2,td.textContent.trim());toast('Đã sửa '+byName.TQN_CONFIG.get(+td.dataset.r,1))}));
 const hl=$('hlr');if(hl)hl.scrollIntoView({block:'center'});hlRow=0;drawTabs()}
function drawTabs(){$('tabs').innerHTML=book.filter(s=>!s.hidden).map(s=>'<button class="tab'+(s.name===active?' on':'')+(s.name.startsWith('TQN_')?' tqn':'')+'" data-n="'+s.name.replace(/"/g,'&quot;')+'">'+s.name+'</button>').join('');
 $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>showSheet(b.dataset.n))}
function runFn(fn){try{window[fn]();if(fn==='tqnDailyJob'||/Remind|Daily/.test(fn))showMailsIfAny();if(active)showSheet(active)}catch(e){showModal('Lỗi',String(e.message||e))}}
function showMailsIfAny(){if(!mails.length)return;const m=mails[mails.length-1];showModal('Thư nhắc hạn (xem thử, không gửi)','Đến: '+m.to+'\nTiêu đề: '+m.subject+'\n\n'+String(m.htmlBody||m.body||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,1500))}
function buildMenu(){const box=$('menus');const b=document.createElement('button');b.className='mbtn tqn';b.textContent='TQN Register ▾';
 const d=document.createElement('div');d.className='drop';d.style.left=b.offsetLeft+'px';
 menuItems.forEach(it=>{if(!it){d.appendChild(document.createElement('hr'));return}const x=document.createElement('button');x.textContent=it[0];x.onclick=()=>{d.classList.remove('show');runFn(it[1])};d.appendChild(x)});
 const sch=document.createElement('button');sch.textContent='(Xem thử) Lịch đã bật';sch.onclick=()=>{d.classList.remove('show');showModal('Lịch tự chạy (xem thử)',triggers.length?triggers.map(t=>t.fn+(String(t.h).startsWith('mỗi')?' '+t.h:' lúc ~'+t.h+':00 hằng ngày')).join('\n')+'\n\nBản thật: Google tự chạy cả khi máy tắt.':'Chưa bật lịch nào.')};
 d.appendChild(document.createElement('hr'));d.appendChild(sch);
 const q=$('quick');[
  ['Hằng ngày','#1B3F7A','#e8f0fe',[['↻','Nhập & kiểm tra','tqnMenuRun',1],['▦','Kiểm soát quy trình + AI','tqnMenuWorkflow'],['＋','Tạo hồ sơ / cấp mã','tqnMenuNewDoc'],['☰','Bảng điều khiển','tqnShowSidebar']]],
  ['Tự động','#0f7a6d','#e6f6f4',[['★','Bật tự động tất cả','tqnMenuSetupAll'],['◷','Trạng thái','tqnMenuAutoStatus']]],
  ['Thời tiết','#8a6100','#fef7e0',[['☁','Cập nhật ngay','tqnMenuWeatherNow']]],
  ['Giao diện','#4d5a6b','#f1f3f6',[['◐','Dễ nhìn','tqnMenuTheme'],['↺','Trả lại gốc','tqnMenuRestoreTheme']]]
 ].forEach(([g,ac,ab,items])=>{const w=document.createElement('div');w.className='qg';w.innerHTML='<em>'+g+'</em>';
  items.forEach(([ic,l,f,pr])=>{if(!menuItems.some(m=>m&&m[1]===f))return;const x=document.createElement('button');x.style.setProperty('--ac',ac);x.style.setProperty('--ab',ab);x.innerHTML='<i>'+ic+'</i>'+l;if(pr)x.className='pr';x.onclick=()=>runFn(f);w.appendChild(x)});q.appendChild(w)});
 b.onclick=e=>{e.stopPropagation();d.style.left=b.offsetLeft+'px';d.classList.toggle('show')};box.appendChild(b);box.appendChild(d);document.addEventListener('click',()=>d.classList.remove('show'))}
let sideSrc='',HTML={};
const GSHIM='<script>window.google={script:{run:(function(){function mk(ok,fail){return new Proxy({},{get:function(_,k){if(k==="withSuccessHandler")return function(f){return mk(f,fail)};if(k==="withFailureHandler")return function(f){return mk(ok,f)};return function(){var a=arguments;setTimeout(function(){try{Promise.resolve(parent[k].apply(parent,a)).then(function(r){parent.afterCall(k);ok&&ok(r)},function(e){fail&&fail(e)})}catch(e){fail&&fail(e)}},0)}}})}return mk()})()},host:{close:function(){parent.closeDialog()}}};<\/script>';
function withShim(src){return src.replace('<script>',GSHIM+'<script>')}
function openDialog(name,title){$('dlgT').textContent=title||name;document.querySelector('#dlg .box').style.maxWidth=name==='NewDoc'?'560px':'1180px';$('dlgF').srcdoc=withShim(HTML[name]||'<p>Thiếu '+name+'</p>');$('dlg').classList.add('show')}
function closeDialog(){$('dlg').classList.remove('show');if(active)showSheet(active)}
window.afterCall=(k)=>{if(k==='tqnGoto'){closeDialog();if(innerWidth<800)closeSide()}};
function openSide(){$('side').classList.add('show');
 $('sideF').srcdoc=withShim(sideSrc)}
function closeSide(){$('side').classList.remove('show')}

(async()=>{const data=JSON.parse(document.getElementById('tqn-data').textContent);WEATHER_RAW=data.weather_raw;STYLES=data.styles||{};HTML=data.html;sideSrc=HTML.Sidebar;
 data.sheets.forEach(s=>{const sh=new Sheet(s.name,s);book.push(sh);byName[s.name]=sh;ORIGINAL.add(s.name)});
 $('src').textContent='Bản chụp Register · '+data.sheets.length+' tab · ẩn '+data.pii_hidden.length+' tab có SĐT/email';
 onOpen();buildMenu();showSheet('Sổ trình duyệt');toast('Bấm các nút phía trên để chạy thử: Nhập & kiểm tra, Bảng điều khiển, Thời tiết…');
 window.__ready=true})().catch(e=>{const b=document.getElementById('err');b.style.display='block';b.textContent='Lỗi khởi động: '+(e.message||e)});
