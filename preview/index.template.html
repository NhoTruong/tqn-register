/* ===== Bản xem thử: AI dùng Claude của trang (thay khóa API), thời tiết dùng số liệu dự báo đã lưu ===== */
let SAMPLE=null;(async()=>{try{SAMPLE=window.claude&&await window.claude.use('sample')}catch(e){SAMPLE=null}})();
window.tqnAiBlocked_=function(){return SAMPLE?'':'Bản xem thử: mở trang trên claude.ai để dùng AI (bản thật dùng khóa API trong Apps Script).'};
async function sampleText_(prompt,images){if(!SAMPLE)throw new Error(tqnAiBlocked_());
 try{const r=await SAMPLE(prompt,images?{modelTier:'default',images:images}:{modelTier:'default'});return r.text}
 catch(e){throw new Error(e.code==='rate_limited'?'AI đang bận, thử lại sau ít phút.':(e.code==='not_granted'?'Chưa cho phép trang dùng AI (bấm Cho phép khi được hỏi).':'Gọi AI lỗi: '+(e.message||e.code)))}}
window.tqnAiBatch=async function(){const sh=tqnSs_().getSheetByName('TQN_QUY_TRINH');if(!sh||sh.getLastRow()<2)tqnRunAll_();
 const s2=tqnSs_().getSheetByName('TQN_QUY_TRINH'),rows=s2.getRange(2,1,s2.getLastRow()-1,TQN_WF_HEADERS.length).getValues().filter(r=>r[11]||/^4/.test(r[0])).slice(0,5);
 let ok=0;const err=[];for(const r of rows){try{await tqnAiAnalyze(r[13]);ok++}catch(e){err.push(r[3]+': '+e.message);if(/Chưa cho phép|bản xem thử/i.test(e.message))break}}
 return 'AI đã đọc '+ok+'/'+rows.length+' hồ sơ quá hạn / bị trả về → tab TQN_AI (bản nháp).'+(err.length?' Lỗi: '+err[0]:'')};
window.tqnAiReadForm=async function(b64,mime){if(/pdf/i.test(mime))throw new Error('Bản xem thử chỉ đọc ảnh (JPG/PNG). Bản thật đọc được cả PDF.');
 const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const o=tqnFormParse_(await sampleText_(TQN_FORM_PROMPT,[new Blob([u],{type:mime||'image/jpeg'})]));const r=tqnFormMatch_(o);r.ai=o;tqnAudit_('AI_DOC_PHIEU',o.so_hieu,{tin_cay:o.do_tin_cay});return r};
function previewWeatherOn_(){try{const c=byName.TQN_CONFIG;if(!c)return;for(let r=2;r<=c.getLastRow();r++){const k=c.get(r,1);if(k==='weather_enabled'||k==='weather_license_ok')c.set(r,2,'Có')}}catch(e){}}
window.tqnAiAnalyze=async function(at){
 const rec=tqnAiRecord_(at),prompt=tqnAiPrompt_(rec);
 let sample=null;try{sample=window.claude&&await window.claude.use('sample')}catch(e){}
 if(!sample)throw new Error('Bản xem thử chưa được dùng AI ở đây (mở trang trên claude.ai và cho phép khi được hỏi). Bản thật dùng khóa API trong Apps Script.');
 let r;try{r=await sample(prompt,{modelTier:'default'})}catch(e){throw new Error(e.code==='rate_limited'?'AI đang bận, thử lại sau ít phút.':(e.code==='not_granted'?'Chưa cho phép trang dùng AI.':'Gọi AI lỗi: '+(e.message||e.code)))}
 const o=tqnAiParse_(r.text);tqnAiSave_(rec,o,'Claude (bản xem thử)');o.so=rec['Số hiệu (nguyên văn)'];o.at=rec['Nguồn'];o.model='Claude (bản xem thử)';return o};
</script>

var ICO={"refresh": "<path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7\"/>", "board": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M9 4v16M15 4v16\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "panel": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M15 4v16\"/>", "star": "<path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "cloud": "<path d=\"M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z\"/>", "palette": "<path d=\"M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.5-1.5 0-.9-.7-1.2-.7-2s.7-1.5 1.7-1.5H17a4 4 0 0 0 4-4c0-4.4-4-9-9-9z\"/><circle cx=\"7.5\" cy=\"11\" r=\"1\"/><circle cx=\"10\" cy=\"7\" r=\"1\"/><circle cx=\"15\" cy=\"7.5\" r=\"1\"/>", "undo": "<path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/>", "spark": "<path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"/><path d=\"M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\"/>"};function svg(n){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICO[n]||"")+"</svg>"}

<script>
/* ===== Giao diện ===== */
const $=id=>document.getElementById(id);
function showModal(t,b){$('mT').textContent=t;$('mB').textContent=b;$('modal').classList.add('show')}
function hideModal(){$('modal').classList.remove('show')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function cellText(x){if(x instanceof Date&&!isNaN(x))return fmt2(x.getDate())+'/'+fmt2(x.getMonth()+1)+'/'+x.getFullYear();if(typeof x==='number')return String(Math.round(x*100)/100);return x===undefined||x===null?'':String(x)}
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
function a1(ref){const m=/^([A-Z]+)(\d+)$/.exec(ref);let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return [+m[2],c]}
function rngOf(sq){return String(sq).split(' ').map(p=>{const [a,b]=p.split(':');const x=a1(a),y=a1(b||a);return [x[0],x[1],y[0],y[1]]})}
function showSheet(name){active=name;const sh=byName[name];if(!sh)return;
 const ST=(STYLES[name]||{}),sty=ST.s||{},cw=ST.cw||{};
 const R=Math.max(sh.getLastRow(),1),C=Math.min(Math.max(sh.getLastColumn(),1),60);const edit=name==='TQN_CONFIG';
 const cond=[];(sh.cfr||[]).forEach(r=>{const g=r.o.r[0];cond.push({g:[g.r,g.c,g.r+g.nr-1,g.c+g.nc-1],v:r.o.v,bg:r.o.bg,fc:r.o.fc})});
 (ST.cf||[]).forEach(r=>rngOf(r[0]).forEach(g=>cond.push({g,v:r[1],bg:r[2],fc:r[3]})));
 const skip={},span={};(ST.m||[]).forEach(m=>{const [r1,c1,r2,c2]=rngOf(m)[0];span[r1+','+c1]=[r2-r1+1,c2-c1+1];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(r!==r1||c!==c1)skip[r+','+c]=1});
 const isT=name.startsWith('TQN_');const DVR=(ST.dv||[]).map(d=>[rngOf(d[0]),d[1]]);const dvAt=(r,c)=>{const h=DVR.find(d=>d[0].some(g=>r>=g[0]&&r<=g[2]&&c>=g[1]&&c<=g[3]));return h?h[1]:null};
 let h='<table class="g"><colgroup><col style="width:42px">';for(let c=1;c<=C;c++){if(sh.hc&&sh.hc.has(c))continue;const w=cw[colL(c)];h+='<col style="width:'+(w?Math.min(w,420):isT?150:96)+'px">'}h+='</colgroup><tr><th></th>';
 for(let c=1;c<=C;c++)if(!(sh.hc&&sh.hc.has(c)))h+='<th>'+colL(c)+'</th>';h+='</tr>';
 for(let r=1;r<=R;r++){h+='<tr'+(r===hlRow?' class="hl" id="hlr"':'')+'><td class="rn">'+r+'</td>';
  for(let c=1;c<=C;c++){if(skip[r+','+c]||(sh.hc&&sh.hc.has(c)))continue;const x=sh.get(r,c),t=cellText(x).replace(/[&<>]/g,q=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[q]));
   const k=r+','+c,s0=sty[k]||[],sp=span[k];let css='';
   if(s0[0])css+='background:'+s0[0]+';';if(s0[1])css+='color:'+s0[1]+';';if(s0[2])css+='font-weight:700;';if(s0[3])css+='text-align:'+s0[3]+';';
   if(isT&&r===1)css+='background:#1B3F7A;color:#fff;font-weight:700;';
   const hit=cond.find(q=>r>=q.g[0]&&r<=q.g[2]&&c>=q.g[1]&&c<=q.g[3]&&String(x).trim()===q.v);if(hit){if(hit.bg)css+='background:'+hit.bg+';';if(hit.fc)css+='color:'+hit.fc+';';css+='font-weight:500;'}
   const ed=edit&&c===2&&r>1;const op=!sh.f[r+','+c]&&dvAt(r,c);
   h+='<td'+(sp?' rowspan="'+sp[0]+'" colspan="'+sp[1]+'"':'')+(typeof x==='number'&&!s0[3]?' class="num"':'')+(ed?' class="ed" contenteditable data-r="'+r+'"':'')+(op?' data-dv="'+r+','+c+'"':'')+(sh.f[r+','+c]&&dvAt(r,c)?' data-fx="1"':'')+(css?' style="'+css+'"':'')+' title="'+t.slice(0,300)+'">'+(op?'<span class="dd">▾</span>':'')+t+'</td>'}h+='</tr>'}
 $('grid').innerHTML=h+'</table>';
 if(edit)$('grid').querySelectorAll('td.ed').forEach(td=>td.addEventListener('blur',()=>{byName.TQN_CONFIG.set(+td.dataset.r,2,td.textContent.trim());toast('Đã sửa '+byName.TQN_CONFIG.get(+td.dataset.r,1))}));
 $('grid').querySelectorAll('td[data-fx]').forEach(td=>td.onclick=()=>toast('Ô này là công thức, tự tính theo cột Kết quả / Hạn – không chọn tay. Chọn ở cột có dấu ▾.'));
 $('grid').querySelectorAll('td[data-dv]').forEach(td=>td.onclick=(ev)=>{ev.stopPropagation();const [r,c]=td.dataset.dv.split(',').map(Number);openDD(td,sh,name,dvAt(r,c))});
 const hl=$('hlr');if(hl)hl.scrollIntoView({block:'center'});hlRow=0;drawTabs()}
function drawTabs(){$('tabs').innerHTML=book.filter(s=>!s.hidden).map(s=>'<button class="tab'+(s.name===active?' on':'')+(s.name.startsWith('TQN_')?' tqn':'')+'" data-n="'+s.name.replace(/"/g,'&quot;')+'"'+(s.tabc?' style="--tc:'+s.tabc+'"':'')+'>'+s.name+'</button>').join('');
 $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>showSheet(b.dataset.n))}
function runFn(fn){try{window[fn]();if(fn==='tqnDailyJob'||/Remind|Daily|Email/.test(fn))showMailsIfAny();if(active)showSheet(active)}catch(e){showModal('Lỗi',String(e.message||e))}}
function showMailsIfAny(){if(!mails.length)return;const m=mails[mails.length-1];showModal('Thư nhắc hạn (xem thử, không gửi)','Đến: '+m.to+'\nTiêu đề: '+m.subject+'\n\n'+String(m.htmlBody||m.body||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,1500))}
function buildMenu(){const box=$('menus');const b=document.createElement('button');b.className='mbtn tqn';b.textContent='TQN Register ▾';
 const d=document.createElement('div');d.className='drop';d.style.left=b.offsetLeft+'px';
 menuItems.forEach(it=>{if(!it){d.appendChild(document.createElement('hr'));return}const x=document.createElement('button');x.textContent=it[0];x.onclick=()=>{d.classList.remove('show');runFn(it[1])};d.appendChild(x)});
 const sch=document.createElement('button');sch.textContent='(Xem thử) Lịch đã bật';sch.onclick=()=>{d.classList.remove('show');showModal('Lịch tự chạy (xem thử)',triggers.length?triggers.map(t=>t.fn+(String(t.h).startsWith('mỗi')?' '+t.h:' lúc ~'+t.h+':00 hằng ngày')).join('\n')+'\n\nBản thật: Google tự chạy cả khi máy tắt.':'Chưa bật lịch nào.')};
 d.appendChild(document.createElement('hr'));d.appendChild(sch);
 const q=$('quick');[
  ['Hằng ngày','#1B3F7A','#e8f0fe',[['board','Quản lý hồ sơ','tqnMenuManager',1],['refresh','Nhập & kiểm tra','tqnMenuRun'],['board','Kiểm soát quy trình + AI','tqnMenuWorkflow'],['plus','Tạo hồ sơ / cấp mã','tqnMenuNewDoc'],['panel','Bảng điều khiển','tqnShowSidebar']]],
  ['Tự động','#0f7a6d','#e6f6f4',[['star','Bật tự động tất cả','tqnMenuSetupAll'],['clock','Trạng thái','tqnMenuAutoStatus']]],
  ['Quản lý','#0F6E66','#E6F4F1',[['refresh','Trình lại rev mới','tqnMenuTrinhLai'],['clock','Tính lại ai giữ','tqnMenuTinhLaiQuanLy']]],
  ['Thời tiết','#8a6100','#fef7e0',[['cloud','Cập nhật ngay','tqnMenuWeatherNow']]],
  ['Giao diện','#4d5a6b','#f1f3f6',[['palette','Dễ nhìn','tqnMenuTheme'],['undo','Trả lại gốc','tqnMenuRestoreTheme']]]
 ].forEach(([g,ac,ab,items])=>{const w=document.createElement('div');w.className='qg';w.innerHTML='<em>'+g+'</em>';
  items.forEach(([ic,l,f,pr])=>{if(!menuItems.some(m=>m&&m[1]===f))return;const x=document.createElement('button');x.style.setProperty('--ac',ac);x.style.setProperty('--ab',ab);x.innerHTML='<i>'+svg(ic)+'</i>'+l;if(pr)x.className='pr';x.onclick=()=>runFn(f);w.appendChild(x)});q.appendChild(w)});
 b.onclick=e=>{e.stopPropagation();d.style.left=b.offsetLeft+'px';d.classList.toggle('show')};box.appendChild(b);box.appendChild(d);document.addEventListener('click',()=>d.classList.remove('show'))}
let sideSrc='',HTML={};var PREVIEW_QL=0;
const GSHIM='<script>window.google={script:{run:(function(){function mk(ok,fail){return new Proxy({},{get:function(_,k){if(k==="withSuccessHandler")return function(f){return mk(f,fail)};if(k==="withFailureHandler")return function(f){return mk(ok,f)};return function(){var a=arguments;setTimeout(function(){try{Promise.resolve(parent[k].apply(parent,a)).then(function(r){parent.afterCall(k);ok&&ok(r)},function(e){fail&&fail(e)})}catch(e){fail&&fail(e)}},0)}}})}return mk()})()},host:{close:function(){parent.closeDialog()}}};<\/script>';
function withShim(src){return src.replace('<script>',GSHIM+'<script>')}
function openDialog(name,title){$('dlgT').textContent=title||name;document.querySelector('#dlg .box').style.maxWidth=name==='NewDoc'?'560px':'1200px';$('dlgF').srcdoc=withShim(HTML[name]||'<p>Thiếu '+name+'</p>');$('dlg').classList.add('show')}

/* Danh sách chọn tự bung ra ngay khi bấm 1 lần (thay cho <select> phải bấm 2 lần) */
function closeDD(){const m=document.getElementById('ddm');if(m)m.remove()}
function openDD(td,sh,name,ops){closeDD();const [r,c]=td.dataset.dv.split(',').map(Number),cur=String(sh.get(r,c));
 const m=document.createElement('div');m.id='ddm';m.className='ddm';
 const pick=v=>{sh.v[r-1]=sh.v[r-1]||[];while(sh.v[r-1].length<c)sh.v[r-1].push('');sh.v[r-1][c-1]=v;closeDD();if(window.TQN_EDIT)TQN_EDIT(sh,r,c,cur);const g=$('grid'),st=g.scrollTop,sl=g.scrollLeft;showSheet(name);g.scrollTop=st;g.scrollLeft=sl;toast('Đã chọn: '+(v||'(trống)')+' – ô đổi màu theo lựa chọn')};
 [''].concat(ops).forEach(o=>{const b=document.createElement('button');const col=(typeof tqnOptColor_==='function'&&o)?tqnOptColor_(o):null;
  b.innerHTML='<i style="background:'+(col?col[1]:'#fff')+';border-color:'+(col?col[2]:'#cbd5e1')+'"></i>'+(o?o.replace(/</g,'&lt;'):'<span style="color:#94a3b8">(để trống)</span>')+(o===cur?' <b>✓</b>':'');
  b.onclick=e=>{e.stopPropagation();pick(o)};m.appendChild(b)});
 document.body.appendChild(m);const R=td.getBoundingClientRect();let top=R.bottom+2,left=R.left;
 const h=m.offsetHeight,w=m.offsetWidth;if(top+h>innerHeight-8)top=Math.max(8,R.top-h-2);if(left+w>innerWidth-8)left=innerWidth-w-8;m.style.top=top+'px';m.style.left=left+'px'}
document.addEventListener('click',e=>{if(!e.target.closest||!e.target.closest('#ddm'))closeDD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDD()});document.addEventListener('scroll',e=>{if(!(e.target.closest&&e.target.closest('#ddm')))closeDD()},true);
function closeDialog(){$('dlg').classList.remove('show');if(active)showSheet(active)}
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg'){closeDialog();toast('Đã đóng bảng – bấm ô có ▾ để chọn. Mở lại: nút "Quản lý hồ sơ"')}});
window.afterCall=(k)=>{if(k==='tqnGoto'){closeDialog();if(innerWidth<800)closeSide()}};
function openSide(){$('side').classList.add('show');
 $('sideF').srcdoc=withShim(sideSrc)}
function closeSide(){$('side').classList.remove('show')}

(async()=>{const data=await (await fetch('data.json')).json();WEATHER_RAW=data.weather_raw;STYLES=data.styles||{};HTML=data.html;sideSrc=HTML.Sidebar;
 data.sheets.forEach(s=>{const sh=new Sheet(s.name,s);book.push(sh);byName[s.name]=sh;ORIGINAL.add(s.name)});
 $('src').textContent='Bản chụp Register · '+data.sheets.length+' tab · ẩn '+data.pii_hidden.length+' tab có SĐT/email';
 onOpen();buildMenu();try{tqnEnsureConfig_();tqnEnsureWeatherConfig_();previewWeatherOn_();tqnApplyTheme()}catch(e){}try{tqnCaiQuanLy();tqnAnHienTuVan(true);PREVIEW_QL=1}catch(e){console.error('QL',e);toast('Quản lý theo phiếu: '+e.message)}showSheet('Sổ trình duyệt');{const m=decodeURIComponent(location.hash).match(/tab=([^&]+)/);if(m&&byName[m[1]])showSheet(m[1])}if(!/nomgr/.test(location.hash))runFn('tqnMenuManager');toast('Đang xem ở chế độ Giao diện dễ nhìn · bấm "Trả lại gốc" để xem màu ban đầu');
 window.__ready=true})();
